; Paper-VIM configuration example
; Copy this file to paper-vim.ini next to paper-vim.ahk and edit values.
; Every value is optional; omitted values use config.ahk defaults.
; Restart Paper-VIM after changing this file.

[Layout]
FullWidthRatio=1.0
FocusWidthRatio=0.85
Gap=8
BarHeight=60
EmergencyMargin=40
EmergencyMinWidth=400
EmergencyMinHeight=300
EmergencyMaxWidth=1200
EmergencyMaxHeight=800
TaskbarMode=auto
TaskbarSize=0

[Colors]
HUDBackgroundColor=121212
DockBackgroundColor=1a1a1a
NormalModeColor=c00FF00
VisualModeColor=cFF0000
InsertModeColor=c00BFFF
TargetingModeColor=cFF00FF
FlashMsgColor=cFFFF00
SuspendedModeColor=cFF8800
ActiveIndicatorColor=00FF00
DockInactiveNumberColor=c888888

[FocusBorder]
FocusBorderEnabled=true
FocusBorderColor=00A8FF
FocusBorderThickness=3
FocusBorderUpdateInterval=50

[Fonts]
FontFamily=Segoe UI
HUDFontSize=s16
HUDFontWeight=w800
DockNumberFontSize=s8

[Dock]
DockIconSize=32
DockIconSpacing=8
DockLeftCount=2
DockRightCount=2
DockMarginX=12
DockMarginY=8
DockPosY=10
DockNumberHeight=16

[HUD]
HUDMarginRight=20
HUDPosY=40
HUDWidth=220
FlashDuration=800

[Timing]
DblClickTimeout=400
DebounceDelay=50
DesktopSwitchDelay=200
DockUpdateDelay=100
TooltipDuration=1000

[Targeting]
TargetMinCellSize=8
TargetGridRows=2
TargetGridCols=2
TargetGridKeys=h, j, k, l

[Exclusions]
; Built-in floating rules: owned windows, #32770, MsiDialogCloseClass, msiexec.exe
Processes=Microsoft.CmdPal.UI.exe
Classes=

[Keys.Global]
ToggleVim=CapsLock

[Keys.Suspend]
Suspend=^q

[Keys.Desktop]
PrevDesktop=^j
NextDesktop=^k
Desktop1=^1
Desktop2=^2
Desktop3=^3
Desktop4=^4
Desktop5=^5

[Keys.Manage]
Overlay=^f
RemoveWindow=^+d
ToggleTaskbar=^t
SwapLeft=^h
SwapRight=^l
NextWindow=n
PrevWindow=Tab
Reflow=z
Width25=^+1
Width50=^+2
Width75=^+3
WidthFull=^+0
Center=^+c

[Keys.Text]
Left=h
Down=j
Up=k
Right=l
WordNext=w
WordPrev=b
WordEnd=e
LineStart=0
LineEnd=+4
PageDown=^d
PageUp=^u
VisualMode=v
Insert=i
GotoStart=g
GotoEnd=+g

[Keys.Normal]
Target=m
Find=f
Till=t
AppFind=/
DeleteLine=d
Change=c
Yank=y
Paste=p
Undo=u
Redo=^r
DeleteChar=x
OpenBelow=o
OpenAbove=+o
Append=a
AppendEnd=+a
Semicolon=SC027
Command=+SC027
Window1=1
Window2=2
Window3=3
Window4=4
Window5=5
Window6=6
Window7=7
Window8=8
Window9=9

[Keys.Visual]
Delete=d
Change=c
Yank=y
DeleteChar=x
Paste=p
UnsupportedA=a
UnsupportedShiftA=+a
UnsupportedO=o
UnsupportedShiftO=+o
UnsupportedSemicolon=SC027
UnsupportedColon=+SC027
UnsupportedLess=+SC033
UnsupportedGreater=+SC034
UnsupportedShiftV=+v
UnsupportedCtrlV=^v
UnsupportedFind=f
UnsupportedTill=t
UnsupportedAppFind=/

[Keys.Escape]
Escape=Esc

[Keys.Help]
Help=F1
